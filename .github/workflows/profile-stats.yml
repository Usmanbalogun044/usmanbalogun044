name: Update GitHub profile metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/generate_profile_stats.py
      - .github/workflows/profile-stats.yml

concurrency:
  group: profile-metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  public-profile-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate account-wide public GitHub stats
        run: python3 scripts/generate_profile_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit public profile statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/metrics.svg
          if git diff --cached --quiet; then
            echo "Profile statistics have not changed."
            exit 0
          fi
          git commit -m "chore: refresh public GitHub profile statistics [skip ci]"
          git push

  contribution-calendar:
    needs: public-profile-stats
    runs-on: ubuntu-latest
    steps:
      - name: Generate full-year contribution calendar
        uses: lowlighter/metrics@latest
        with:
          user: Usmanbalogun044
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore: refresh contribution calendar [Skip GitHub Action]"
          filename: profile/isocalendar.svg
          template: classic
          base: ""
          config_timezone: Africa/Lagos
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
