name: Update GitHub profile metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile overview, language breakdown and achievements
        uses: lowlighter/metrics@latest
        with:
          user: Usmanbalogun044
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore: refresh GitHub profile metrics [Skip GitHub Action]"
          filename: profile/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Lagos
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 12

      - name: Generate full-year contribution calendar
        uses: lowlighter/metrics@latest
        with:
          user: Usmanbalogun044
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore: refresh contribution calendar [Skip GitHub Action]"
          filename: profile/isocalendar.svg
          template: classic
          base: ""
          config_timezone: Africa/Lagos
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate coding habits and activity charts
        uses: lowlighter/metrics@latest
        with:
          user: Usmanbalogun044
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "chore: refresh coding habits [Skip GitHub Action]"
          filename: profile/habits.svg
          template: classic
          base: ""
          config_timezone: Africa/Lagos
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30
